<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Финансы</title>

  <!-- Telegram Web App SDK and Chart.js must be available for app.js -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="title">💰 Финансы</div>
      <div class="subtitle" id="userLine">Личная аналитика</div>
    </div>

    <div class="top-actions">
      <select id="period">
        <option value="day">День</option>
        <option value="week">Неделя</option>
        <option value="month" selected>Месяц</option>
        <option value="year">Год</option>
        <option value="all">Всё время</option>
      </select>

      <button class="refresh" id="refresh" type="button" title="Обновить">↻</button>
    </div>
  </header>

  <main id="app">
    <div class="loading">
      <div class="loading-spinner">↻</div>
      <div>Загружаю статистику…</div>
    </div>
  </main>

  <div class="footer">Financebot</div>
</div>

<script defer src="static/js/app.js"></script>
</body>
</html>
