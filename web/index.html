<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>Финансы</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #101014);
      --card: var(--tg-theme-secondary-bg-color, #1c1c22);
      --card2: rgba(255,255,255,.055);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #9da0a8);
      --accent: var(--tg-theme-button-color, #7c5cff);

      --green: #35c759;
      --red: #ff453a;
      --blue: #0a84ff;
      --orange: #ff9f0a;

      --border: rgba(255,255,255,.07);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      padding: 14px 14px 40px;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
    }

    /* ---------- HEADER ---------- */

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 28px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: -.7px;
    }

    .subtitle {
      color: var(--hint);
      font-size: 14px;
      margin-top: 5px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select,
    .refresh {
      border: 0;
      color: var(--text);
      background: var(--card);
      border-radius: 14px;
      padding: 11px 13px;
      outline: none;
    }

    select {
      min-width: 108px;
    }

    .refresh {
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 20px;
      cursor: pointer;
    }

    .refresh:active {
      transform: scale(.94);
    }

    .refresh.loading {
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- HERO ---------- */

    .hero {
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 85% 10%,
          rgba(255,255,255,.18),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #6747ff 0%,
          #7d4cff 45%,
          #a457ff 100%
        );

      border-radius: 26px;
      padding: 22px;
      margin-bottom: 14px;

      box-shadow:
        0 18px 45px rgba(103,71,255,.25);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -60px;
      bottom: -70px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }

    .hero-label {
      font-size: 14px;
      opacity: .78;
    }

    .hero-balance {
      margin-top: 5px;
      font-size: 39px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .hero-balance.negative {
      color: #fff;
    }

    .hero-balance.positive {
      color: #fff;
    }

    .hero-period {
      margin-top: 5px;
      font-size: 13px;
      opacity: .7;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .hero-stat {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 17px;
      padding: 13px;
      backdrop-filter: blur(10px);
    }

    .hero-stat-label {
      font-size: 13px;
      opacity: .78;
    }

    .hero-stat-value {
      margin-top: 4px;
      font-size: 19px;
      font-weight: 800;
    }

    /* ---------- QUICK STATS ---------- */

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .quick-card {
      background: var(--card);
      border-radius: 18px;
      padding: 14px;
      min-width: 0;
    }

    .quick-icon {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .quick-label {
      color: var(--hint);
      font-size: 12px;
    }

    .quick-value {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- CARDS ---------- */

    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 17px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.2px;
    }

    .card-subtitle {
      color: var(--hint);
      font-size: 12px;
    }

    /* ---------- CHART ---------- */

    .chart-wrap {
      position: relative;
      height: 255px;
    }

    .chart-wrap.small {
      height: 225px;
    }

    .chart-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--hint);
      font-size: 14px;
    }

    /* ---------- TWO COLUMN ---------- */

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* ---------- LIST ---------- */

    .list {
      margin-top: 5px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row-left {
      min-width: 0;
      flex: 1;
    }

    .row-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      color: var(--hint);
      font-size: 12px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-right {
      text-align: right;
      white-space: nowrap;
    }

    .amount {
      font-size: 14px;
      font-weight: 800;
    }

    .income {
      color: var(--green);
    }

    .expense {
      color: var(--red);
    }

    .category-percent {
      color: var(--hint);
      font-size: 11px;
      margin-top: 3px;
    }

    /* ---------- EMPTY ---------- */

    .empty {
      padding: 25px 10px;
      text-align: center;
      color: var(--hint);
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .empty-title {
      color: var(--text);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .empty-text {
      font-size: 13px;
    }

    /* ---------- PROGRESS ---------- */

    .progress {
      height: 7px;
      background: rgba(128,128,128,.14);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      transition: width .3s ease;
    }

    /* ---------- LOADING / ERROR ---------- */

    .loading {
      text-align: center;
      color: var(--hint);
      padding: 80px 0;
    }

    .loading-spinner {
      font-size: 30px;
      margin-bottom: 10px;
      animation: spin .9s linear infinite;
      display: inline-block;
    }

    .error {
      background: rgba(255,69,58,.12);
      border: 1px solid rgba(255,69,58,.15);
      padding: 17px;
      border-radius: 18px;
      color: #ff8b84;
      line-height: 1.45;
    }

    .retry {
      margin-top: 12px;
      border: 0;
      background: var(--card);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
    }

    /* ---------- FOOTER ---------- */

    .footer {
      text-align: center;
      color: var(--hint);
      font-size: 11px;
      padding: 5px 0 10px;
      opacity: .65;
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 520px) {

      body {
        padding: 12px 12px 30px;
      }

      .title {
        font-size: 26px;
      }

      .top {
        align-items: flex-start;
      }

      .top-actions {
        flex-shrink: 0;
      }

      select {
        min-width: 94px;
        padding: 10px;
      }

      .refresh {
        width: 42px;
        height: 42px;
      }

      .hero {
        padding: 20px;
      }

      .hero-balance {
        font-size: 35px;
      }

      .quick-grid {
        grid-template-columns: 1fr 1fr;
      }

      .quick-card:last-child {
        grid-column: span 2;
      }

      .two-columns {
        grid-template-columns: 1fr;
      }

      .chart-wrap {
        height: 235px;
      }

      .chart-wrap.small {
        height: 215px;
      }
    }

    @media (max-width: 360px) {

      .title {
        font-size: 23px;
      }

      .hero-balance {
        font-size: 31px;
      }

      .hero-stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="top">

    <div>
      <div class="title">💰 Финансы</div>
      <div class="subtitle" id="userLine">
        Личная аналитика
      </div>
    </div>

    <div class="top-actions">

      <select id="period">
        <option value="day">День</option>
        <option value="week">Неделя</option>
        <option value="month" selected>Месяц</option>
        <option value="year">Год</option>
        <option value="all">Всё время</option>
      </select>

      <button
        class="refresh"
        id="refresh"
        type="button"
        title="Обновить"
      >
        ↻
      </button>

    </div>

  </header>


  <!-- APP -->
  <main id="app">

    <div class="loading">
      <div class="loading-spinner">↻</div>
      <div>Загружаю статистику…</div>
    </div>

  </main>


  <div class="footer">
    Financebot
  </div>

</div>


<script>

  /* =========================================================
     TELEGRAM
  ========================================================= */

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    try {
      tg.setHeaderColor?.(
        getComputedStyle(document.documentElement)
          .getPropertyValue('--bg')
          .trim()
      );
    } catch (_) {}
  }


  /* =========================================================
     STATE
  ========================================================= */

  let dailyChart = null;
  let incomeChart = null;
  let expenseChart = null;

  let currentData = null;


  /* =========================================================
     HELPERS
  ========================================================= */

  const money = value => {

    const n = Number(value || 0);

    return new Intl.NumberFormat(
      'ru-RU',
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    ).format(n) + ' zł';

  };


  const number = value => {

    const n = Number(value || 0);

    return new Intl.NumberFormat(
      'ru-RU',
      {
        maximumFractionDigits: 0
      }
    ).format(n);

  };


  const esc = value => {

    return String(value ?? '')
      .replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));

  };


  const periodNames = {
    day: 'сегодня',
    week: 'текущую неделю',
    month: 'текущий месяц',
    year: 'текущий год',
    all: 'всё время'
  };


  function destroyCharts() {

    if (dailyChart) {
      dailyChart.destroy();
      dailyChart = null;
    }

    if (incomeChart) {
      incomeChart.destroy();
      incomeChart = null;
    }

    if (expenseChart) {
      expenseChart.destroy();
      expenseChart = null;
    }

  }


  function dateToLabel(dateString) {

    if (!dateString) {
      return '';
    }

    const parts = dateString.split('-');

    if (parts.length !== 3) {
      return dateString;
    }

    return parts[2] + '.' + parts[1];

  }


  function dateToShort(dateString) {

    if (!dateString) {
      return '';
    }

    const parts = dateString.split('-');

    if (parts.length !== 3) {
      return dateString;
    }

    return parts[2] + '.' + parts[1];

  }


  function getDateRange(period) {

    const now = new Date();

    now.setHours(0, 0, 0, 0);

    let start = new Date(now);
    let end = new Date(now);

    if (period === 'day') {

      end.setDate(end.getDate() + 1);

    }

    else if (period === 'week') {

      const day = start.getDay();
      const mondayOffset = day === 0 ? -6 : 1 - day;

      start.setDate(start.getDate() + mondayOffset);

      end = new Date(start);
      end.setDate(end.getDate() + 7);

    }

    else if (period === 'month') {

      start = new Date(
        now.getFullYear(),
        now.getMonth(),
        1
      );

      end = new Date(
        now.getFullYear(),
        now.getMonth() + 1,
        1
      );

    }

    else if (period === 'year') {

      start = new Date(
        now.getFullYear(),
        0,
        1
      );

      end = new Date(
        now.getFullYear() + 1,
        0,
        1
      );

    }

    else {

      return null;

    }

    return { start, end };

  }


  function localISO(date) {

    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');

    return `${y}-${m}-${d}`;

  }


  /*
    Backend отдаёт только дни, где были операции.

    Здесь мы достраиваем нулевые дни,
    чтобы график выглядел нормально.
  */

  function completeDailyData(rows, period) {

    if (period === 'all') {
      return rows || [];
    }

    const range = getDateRange(period);

    if (!range) {
      return rows || [];
    }

    const map = {};

    (rows || []).forEach(row => {

      map[row.date] = {
        income: Number(row.income || 0),
        expenses: Number(row.expenses || 0)
      };

    });

    const result = [];

    let cursor = new Date(range.start);

    while (cursor < range.end) {

      const key = localISO(cursor);

      result.push({
        date: key,
        income: map[key]?.income || 0,
        expenses: map[key]?.expenses || 0
      });

      cursor.setDate(cursor.getDate() + 1);

    }

    return result;

  }


  /* =========================================================
     LOAD
  ========================================================= */

  async function load() {

    const period =
      document.getElementById('period').value;

    const refreshButton =
      document.getElementById('refresh');

    refreshButton.classList.add('loading');

    destroyCharts();

    document.getElementById('app').innerHTML = `
      <div class="loading">
        <div class="loading-spinner">↻</div>
        <div>Обновляю статистику…</div>
      </div>
    `;

    const headers = {
      'X-Telegram-Init-Data':
        tg?.initData || ''
    };

    try {

      const response = await fetch(
        '/api/dashboard?period=' +
        encodeURIComponent(period),
        {
          headers,
          cache: 'no-store'
        }
      );

      if (!response.ok) {

        if (response.status === 401) {

          throw new Error(
            'Открой Mini App из Telegram, а не обычной вкладкой.'
          );

        }

        throw new Error(
          'Не удалось получить данные.'
        );

      }

      const data = await response.json();

      currentData = data;

      render(data, period);

    }

    catch (error) {

      document.getElementById('app').innerHTML = `
        <div class="error">
          <div>
            ⚠️ ${esc(error.message)}
          </div>

          <button
            class="retry"
            onclick="load()"
          >
            Попробовать снова
          </button>
        </div>
      `;

    }

    finally {

      refreshButton.classList.remove('loading');

    }

  }


  /* =========================================================
     RENDER
  ========================================================= */

  function render(data, period) {

    const income =
      Number(data.income || 0);

    const expenses =
      Number(data.expenses || 0);

    const net =
      Number(data.net ?? income - expenses);

    const savingsPercent =
      income > 0
        ? ((net / income) * 100)
        : 0;

    const expensePercent =
      income > 0
        ? Math.min((expenses / income) * 100, 100)
        : 0;


    const daily =
      completeDailyData(
        data.daily || [],
        period
      );


    document.getElementById('app').innerHTML = `

      <!-- HERO -->

      <section class="hero">

        <div class="hero-label">
          Баланс за выбранный период
        </div>

        <div class="hero-balance ${
          net < 0 ? 'negative' : 'positive'
        }">
          ${net < 0 ? '−' : ''}${money(Math.abs(net))}
        </div>

        <div class="hero-period">
          ${esc(periodNames[period] || period)}
        </div>


        <div class="hero-stats">

          <div class="hero-stat">

            <div class="hero-stat-label">
              💰 Доходы
            </div>

            <div class="hero-stat-value">
              ${money(income)}
            </div>

          </div>


          <div class="hero-stat">

            <div class="hero-stat-label">
              💸 Расходы
            </div>

            <div class="hero-stat-value">
              ${money(expenses)}
            </div>

          </div>

        </div>

      </section>


      <!-- QUICK STATS -->

      <section class="quick-grid">

        <div class="quick-card">

          <div class="quick-icon">
            📈
          </div>

          <div class="quick-label">
            Осталось
          </div>

          <div class="quick-value ${
            net >= 0 ? 'income' : 'expense'
          }">
            ${money(net)}
          </div>

        </div>


        <div class="quick-card">

          <div class="quick-icon">
            📊
          </div>

          <div class="quick-label">
            Доля расходов
          </div>

          <div class="quick-value">
            ${number(expensePercent)}%
          </div>

        </div>


        <div class="quick-card">

          <div class="quick-icon">
            💎
          </div>

          <div class="quick-label">
            Сбережения
          </div>

          <div class="quick-value ${
            savingsPercent >= 0
              ? 'income'
              : 'expense'
          }">
            ${number(savingsPercent)}%
          </div>

        </div>

      </section>


      <!-- DAILY CHART -->

      <section class="card">

        <div class="card-header">

          <div>
            <h2 class="card-title">
              📈 Доходы и расходы
            </h2>

            <div class="card-subtitle">
              По дням
            </div>
          </div>

        </div>

        <div class="chart-wrap">

          ${
            daily.length
              ? '<canvas id="dailyChart"></canvas>'
              : `
                <div class="chart-empty">
                  Нет данных за этот период
                </div>
              `
          }

        </div>

      </section>


      <!-- INCOME / EXPENSE -->

      <div class="two-columns">


        <!-- INCOME -->

        <section class="card">

          <div class="card-header">

            <div>
              <h2 class="card-title">
                💰 Доходы
              </h2>

              <div class="card-subtitle">
                По источникам
              </div>
            </div>

          </div>

          <div class="chart-wrap small">

            ${
              data.income_by_source?.length
                ? '<canvas id="incomeChart"></canvas>'
                : `
                  <div class="chart-empty">
                    Нет доходов
                  </div>
                `
            }

          </div>

          <div id="incomeList"></div>

        </section>


        <!-- EXPENSE -->

        <section class="card">

          <div class="card-header">

            <div>
              <h2 class="card-title">
                💸 Расходы
              </h2>

              <div class="card-subtitle">
                По категориям
              </div>
            </div>

          </div>

          <div class="chart-wrap small">

            ${
              data.expenses_by_category?.length
                ? '<canvas id="expenseChart"></canvas>'
                : `
                  <div class="chart-empty">
                    Нет расходов
                  </div>
                `
            }

          </div>

          <div id="expenseList"></div>

        </section>


      </div>


      <!-- RECENT -->

      <section class="card">

        <div class="card-header">

          <div>
            <h2 class="card-title">
              🧾 Последние операции
            </h2>

            <div class="card-subtitle">
              Самые свежие записи
            </div>
          </div>

        </div>

        <div id="recentList"></div>

      </section>

    `;


    drawDaily(daily);

    drawIncome(
      data.income_by_source || []
    );

    drawExpenses(
      data.expenses_by_category || []
    );

    renderRecent(
      data.recent || []
    );

  }


  /* =========================================================
     CHART OPTIONS
  ========================================================= */

  function chartTextColor() {

    return getComputedStyle(
      document.documentElement
    ).getPropertyValue('--hint') || '#999';

  }


  function chartGridColor() {

    return 'rgba(128,128,128,.12)';

  }


  const commonScales = {

    x: {

      grid: {
        color: chartGridColor()
      },

      ticks: {
        color: chartTextColor(),
        maxRotation: 0,
        autoSkip: true,
        maxTicksLimit: 7
      }

    },

    y: {

      beginAtZero: true,

      grid: {
        color: chartGridColor()
      },

      ticks: {
        color: chartTextColor(),

        callback: value => {

          return value + ' zł';

        }

      }

    }

  };


  /* =========================================================
     DAILY CHART
  ========================================================= */

  function drawDaily(rows) {

    const canvas =
      document.getElementById('dailyChart');

    if (!canvas) {
      return;
    }

    dailyChart = new Chart(
      canvas,
      {
        type: 'line',

        data: {

          labels:
            rows.map(row =>
              dateToLabel(row.date)
            ),

          datasets: [

            {
              label: 'Доходы',

              data:
                rows.map(row =>
                  Number(row.income || 0)
                ),

              borderColor: '#0a84ff',

              backgroundColor:
                'rgba(10,132,255,.12)',

              pointBackgroundColor: '#0a84ff',

              pointRadius: 3,

              pointHoverRadius: 6,

              borderWidth: 3,

              tension: .35,

              fill: true
            },

            {
              label: 'Расходы',

              data:
                rows.map(row =>
                  Number(row.expenses || 0)
                ),

              borderColor: '#ff453a',

              backgroundColor:
                'rgba(255,69,58,.08)',

              pointBackgroundColor: '#ff453a',

              pointRadius: 3,

              pointHoverRadius: 6,

              borderWidth: 3,

              tension: .35,

              fill: true
            }

          ]

        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          interaction: {
            mode: 'index',
            intersect: false
          },

          plugins: {

            legend: {

              position: 'top',

              labels: {
                color: chartTextColor(),
                usePointStyle: true,
                boxWidth: 8,
                padding: 15
              }

            },

            tooltip: {

              callbacks: {

                label: context => {

                  return (
                    context.dataset.label +
                    ': ' +
                    money(context.parsed.y)
                  );

                }

              }

            }

          },

          scales: commonScales

        }

      }
    );

  }


  /* =========================================================
     INCOME CHART
  ========================================================= */

  function drawIncome(rows) {

    const canvas =
      document.getElementById('incomeChart');

    const list =
      document.getElementById('incomeList');

    if (!canvas) {

      if (list) {
        list.innerHTML = '';
      }

      return;

    }


    const labels =
      rows.map(row => row.label);

    const values =
      rows.map(row => Number(row.value || 0));


    incomeChart = new Chart(
      canvas,
      {
        type: 'doughnut',

        data: {

          labels,

          datasets: [

            {
              data: values,

              backgroundColor: [
                '#0a84ff',
                '#35c759',
                '#ff9f0a',
                '#af52de',
                '#5e5ce6'
              ],

              borderWidth: 3,

              borderColor:
                getComputedStyle(
                  document.documentElement
                ).getPropertyValue('--card')

            }

          ]

        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          cutout: '66%',

          plugins: {

            legend: {
              display: false
            },

            tooltip: {

              callbacks: {

                label: context => {

                  return (
                    context.label +
                    ': ' +
                    money(context.parsed)
                  );

                }

              }

            }

          }

        }

      }
    );


    const total =
      values.reduce(
        (sum, value) =>
          sum + value,
        0
      );


    list.innerHTML =
      rows.length
        ? rows.map(row => {

            const value =
              Number(row.value || 0);

            const percent =
              total > 0
                ? Math.round(
                    value / total * 100
                  )
                : 0;

            return `

              <div class="row">

                <div class="row-left">

                  <div class="row-title">
                    ${esc(row.label)}
                  </div>

                  <div class="progress">
                    <div
                      class="progress-bar"
                      style="width:${percent}%"
                    ></div>
                  </div>

                </div>

                <div class="row-right">

                  <div class="amount income">
                    ${money(value)}
                  </div>

                  <div class="category-percent">
                    ${percent}%
                  </div>

                </div>

              </div>

            `;

          }).join('')

        : '';

  }

  /* =========================================================
     RECENT OPERATIONS
  ========================================================= */

  function renderRecent(rows) {

    const container =
      document.getElementById('recentList');

    if (!container) {
      return;
    }


    if (!rows.length) {

      container.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🧾
          </div>

          <div class="empty-title">
            Пока нет операций
          </div>

          <div class="empty-text">
            Добавь доход или расход через бота
          </div>

        </div>

      `;

      return;

    }


    container.innerHTML =
      rows.map(row => {

        const isIncome =
          row.kind === 'income';

        const amount =
          Number(row.amount || 0);


        return `

          <div class="row">

            <div class="row-left">

              <div class="row-title">
                ${esc(row.label)}
              </div>

              <div class="row-sub">

                ${esc(dateToShort(row.date))}

                ${
                  row.note
                    ? ' · ' + esc(row.note)
                    : ''
                }

              </div>

            </div>

            <div class="row-right">

              <div
                class="
                  amount
                  ${isIncome ? 'income' : 'expense'}
                "
              >

                ${
                  isIncome
                    ? '+'
                    : '−'
                }${money(amount)}

              </div>

            </div>

          </div>

        `;

      }).join('');

  }


  /* =========================================================
     EVENTS
  ========================================================= */

  document
    .getElementById('period')
    .addEventListener(
      'change',
      load
    );


  document
    .getElementById('refresh')
    .addEventListener(
      'click',
      load
    );


  /* =========================================================
     START
  ========================================================= */

  load();

</script>
